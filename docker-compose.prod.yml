# ============================================================
# QC Exclusive — Docker Compose (Production)
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# ============================================================

version: "3.9"

networks:
  qcexclusive_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qcexclusive_postgres
    restart: unless-stopped
    networks:
      - qcexclusive_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-QCEXCLUSIVE}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-QCEXCLUSIVE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qcexclusive_redis
    restart: unless-stopped
    networks:
      - qcexclusive_net
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./server-side
      dockerfile: Dockerfile
      target: production
    container_name: qcexclusive_backend
    restart: unless-stopped
    networks:
      - qcexclusive_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000

      # Database — points to local postgres service
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-QCEXCLUSIVE}?schema=public

      # JWT
      JWT_ACCESS_TOKEN: ${JWT_ACCESS_TOKEN}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
      JWT_REFRESH_TOKEN: ${JWT_REFRESH_TOKEN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Email (SMTP / Nodemailer via Gmail)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PASS: ${SMTP_PASS}

      # Resend (kept for future, currently disabled)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}

      # Redis — points to local redis service
      RedisHost: redis
      RedisPort: 6379
      RedisUserName: default
      RedisPassword: ${REDIS_PASSWORD}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Apify (scraping)
      APIFY_TOKEN: ${APIFY_TOKEN}
      APIFY_API_BASE_URL: https://api.apify.com

      # Calendly
      CALENDLY_API_KEY: ${CALENDLY_API_KEY}
      CALENDLY_WEBHOOK_SECRET: ${CALENDLY_WEBHOOK_SECRET}
      CALENDLY_API_BASE_URL: https://api.calendly.com

      # n8n
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}

      # CORS
      FRONTEND_URL: ${FRONTEND_URL}
      PRODUCTION_FRONTEND_URL: ${PRODUCTION_FRONTEND_URL}

      # Misc
      DEFAULT_MEETING_LINK: ${DEFAULT_MEETING_LINK}
      BCRYPT_SALT: ${BCRYPT_SALT:-12}
      RUN_SEED: ${RUN_SEED:-false}

    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./client-side
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_BACKEND: ${NEXT_PUBLIC_BACKEND:-/api/v1}
    container_name: qcexclusive_frontend
    restart: unless-stopped
    networks:
      - qcexclusive_net
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BACKEND: ${NEXT_PUBLIC_BACKEND:-/api/v1}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: qcexclusive_nginx
    restart: unless-stopped
    networks:
      - qcexclusive_net
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Mount TLS certs
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
