# ============================================================
# QC Exclusive — Docker Compose (Development)
# ============================================================
# Usage:
#   docker compose -f docker-compose.dev.yml up
# Hot reload is enabled for the backend.
# Frontend runs via npm run dev on the host or in container.
# ============================================================

version: "3.9"

networks:
  qcexclusive_dev:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: qcexclusive_dev_postgres
    restart: unless-stopped
    networks:
      - qcexclusive_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: QCEXCLUSIVE_DEV
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d QCEXCLUSIVE_DEV"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qcexclusive_dev_redis
    restart: unless-stopped
    networks:
      - qcexclusive_dev
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (hot reload with ts-node-dev) ───────────────
  backend:
    build:
      context: ./server-side
      dockerfile: Dockerfile.dev
    container_name: qcexclusive_dev_backend
    restart: unless-stopped
    networks:
      - qcexclusive_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server-side/src:/app/src         # Hot reload source
      - ./server-side/prisma:/app/prisma   # Prisma schema
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:admin123@postgres:5432/QCEXCLUSIVE_DEV?schema=public
      JWT_ACCESS_TOKEN: dev-jwt-access-secret-change-in-prod
      JWT_REFRESH_TOKEN: dev-jwt-refresh-secret-change-in-prod
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RedisHost: redis
      RedisPort: 6379
      RedisUserName: default
      RedisPassword: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      CALENDLY_API_KEY: ${CALENDLY_API_KEY:-}
      CALENDLY_WEBHOOK_SECRET: dev-webhook-secret
      CALENDLY_API_BASE_URL: https://api.calendly.com
      APIFY_API_BASE_URL: https://api.apify.com
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      FRONTEND_URL: http://localhost:3000
      DEV_FRONTEND_URL: http://localhost:3000
      DEV_VITE_URL: http://localhost:5173
    ports:
      - "5000:5000"
