# ============================================================
# QC Exclusive — Nginx Virtual Host
# Replace yourdomain.com with your actual domain.
# For SSL, run Certbot to generate /etc/nginx/ssl/ certs.
# ============================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL Certificates (Let's Encrypt via Certbot) ──────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Next.js Frontend ──────────────────────────────────────
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support (Next.js HMR in dev, SSE in prod)
        proxy_read_timeout 86400;
    }

    # ── Next.js Static Files — long cache ─────────────────────
    location /_next/static/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # ── Express Backend API ───────────────────────────────────
    location /api/v1/ {
        # Rate limiting — auth endpoints get stricter limits
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — Apify scraping can take up to 20 minutes
        proxy_read_timeout 1200s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ── Auth Endpoints — stricter rate limits ──────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Calendly Webhook ──────────────────────────────────────
    location /api/v1/calendly/webhook/ {
        # No rate limit on webhooks from Calendly
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Raw body needed for HMAC signature verification
        proxy_request_buffering off;
    }

    # ── Health Check ──────────────────────────────────────────
    location /health {
        proxy_pass http://backend_app/;
        access_log off;
    }
}
